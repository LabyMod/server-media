name: Validate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  validate_images:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          # This workflow intentionally checks out PR contents to validate JSON and
          # image files only. The checked-out repository must never be built or
          # execute scripts (npm, make, gradle, etc.), otherwise this becomes
          # vulnerable to pwn requests.
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/pull/{0}/merge', github.event.number) }}
          fetch-depth: 2
          allow-unsafe-pr-checkout: true
      # Pull requests only validate the server directories they change, pushes to master validate all of them
      - name: List changed files
        if: github.event_name == 'pull_request_target'
        run: |
          rm -f changed_files.txt
          git -c core.quotePath=false diff --name-status --no-renames HEAD^1 HEAD > changed_files.txt
      - name: Validate images
        uses: LabyMod/server-media/.github/actions/validate@master
  validate_manifest:
    name: Manifest
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          # This workflow intentionally checks out PR contents to validate JSON and
          # image files only. The checked-out repository must never be built or
          # execute scripts (npm, make, gradle, etc.), otherwise this becomes
          # vulnerable to pwn requests.
          ref: refs/pull/${{ github.event.number }}/merge
          fetch-depth: 2
          allow-unsafe-pr-checkout: true
      - name: List changed files
        run: |
          rm -f changed_files.txt
          git -c core.quotePath=false diff --name-status --no-renames HEAD^1 HEAD > changed_files.txt
      - name: Validate manifest
        uses: LabyMod/server-media/.github/actions/validate-manifest@master
        env:
          PR_ID: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
